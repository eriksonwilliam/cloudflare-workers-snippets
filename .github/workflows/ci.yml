name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check, testes (100%) e build do Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Testes com cobertura (falha abaixo de 100%)
        run: npm run coverage

      - name: Validar build do Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
